
name: Flask CI CD to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t flask-devops-app:ci -f dockerfile .

  deploy:
    name: Deploy to EC2
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -e
          cd "$HOME/flask-devops-project"
          git pull --ff-only origin main
          sudo docker build -t flask-devops-app:1.0 -f dockerfile .
          sudo docker rm -f flask-devops-container 2>/dev/null || true
          sudo docker run -d --restart unless-stopped \
            --name flask-devops-container \
            -p 80:5000 \
            -e APP_ENV=production \
            flask-devops-app:1.0
          sleep 3
          curl --fail http://localhost/health
          REMOTE
